name: CI
on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: FPC / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FPC on Windows
        if: runner.os == 'Windows'
        uses: gcarreno/setup-lazarus@v3
        with:
          lazarus-version: stable
      - name: Install FPC on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fp-compiler fp-units-fcl build-essential
      - name: Install FPC on macOS
        if: runner.os == 'macOS'
        run: brew install fpc
      - name: Install optional resource observer
        run: python -m pip install psutil==7.2.2
      - name: Functional checks and descriptive benchmarks
        run: python scripts/check.py
      - name: Source archive and clean consumer check
        run: python scripts/package.py
      - name: Upload checks and release candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-${{ matrix.os }}
          if-no-files-found: error
          path: |
            build/check/
            dist/
