name: CI
on:
  push:
    branches: [main, 'work/**']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: FPC / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FPC on Windows
        if: runner.os == 'Windows'
        timeout-minutes: 9
        shell: pwsh
        run: ./scripts/install-fpc-windows.ps1 -Destination "$env:RUNNER_TEMP/lazarus"
      - name: Install FPC on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fp-compiler fp-units-fcl build-essential
      - name: Install FPC on macOS
        if: runner.os == 'macOS'
        run: brew install fpc
      - name: Install optional resource observer
        run: python -m pip install psutil==7.2.2
      - name: Functional checks and descriptive benchmarks
        run: python scripts/check.py --references
      - name: Source archive and clean consumer check
        run: python scripts/package.py
      - name: Boss install and installed-source consumer check
        env:
          BOSS_TEST_REF: ${{ github.head_ref || github.ref_name }}
          BOSS_TEST_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          BOSS_TEST_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
        shell: python
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, 'scripts/boss_consumer.py',
              '--ref', os.environ['BOSS_TEST_REF'],
              '--expected-commit', os.environ['BOSS_TEST_COMMIT'],
              '--repository', os.environ['BOSS_TEST_REPOSITORY']], check=True)
      - name: Upload checks and release candidates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-${{ matrix.os }}
          if-no-files-found: error
          path: |
            build/check/
            build/boss-consumer/
            dist/
